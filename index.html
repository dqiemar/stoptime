<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Останови время</title>
<style>
:root{color-scheme:dark;--bg:#0f1117;--panel:#1a1d27;--panel2:#232736;--line:#2a2d38;--blue:#8ab4f8;--bluebox:#1b2e4b;--muted:#9aa0a6;--green:#34a853;--red:#ea4335;--gold:#fdd663;--xl:28px;--lg:20px;--md:14px;--ease:cubic-bezier(.2,0,0,1)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{color:#e8eaed;display:flex;justify-content:center;padding:16px;min-height:100vh;overflow-x:hidden;touch-action:pan-y}
button,input{font:inherit}
button{border:0;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.app{width:100%;max-width:640px;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
h1{font-size:1.6rem;text-align:center;margin:0 0 16px;color:var(--blue);font-weight:750;letter-spacing:-.035em}
.timer{font-size:clamp(2.35rem,9vw,3.4rem);font-variant-numeric:tabular-nums;text-align:center;padding:28px 16px;background:var(--panel);border-radius:var(--xl);margin-bottom:16px;letter-spacing:1px;font-weight:750;line-height:1.1;min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow-wrap:anywhere;border:1px solid var(--line);box-shadow:0 8px 24px #0004}
.timer .label{font-size:.85rem;color:var(--muted);font-weight:500;margin-top:8px;letter-spacing:0}
.timer .label strong{color:var(--gold)}
.big-btn{width:100%;min-height:clamp(140px,32vw,220px);border-radius:var(--xl);font-size:clamp(2.2rem,8vw,3.2rem);font-weight:900;letter-spacing:2px;display:flex;align-items:center;justify-content:center;transition:transform .12s var(--ease),filter .12s var(--ease),background .2s var(--ease);box-shadow:0 12px 28px #0005;touch-action:none}
.big-btn:active{transform:scale(.975);filter:brightness(.92)}
.big-btn.start{background:var(--green);color:white}
.big-btn.stop{background:var(--red);color:white}
.btn{width:100%;padding:15px 16px;font-size:1rem;font-weight:650;border-radius:var(--md);transition:filter .15s var(--ease),transform .12s var(--ease);min-height:50px}
.btn:active{filter:brightness(.85);transform:scale(.985)}
.btn.primary{background:var(--green);color:white}
.btn.secondary{background:var(--panel2);color:#e8eaed}
.btn.danger{background:#48232a;color:#ffb5bd}
.card{background:var(--panel);border-radius:var(--xl);padding:20px;margin-bottom:14px;border:1px solid var(--line);min-width:0}
.card h2{font-size:1.05rem;color:var(--muted);margin-bottom:14px;font-weight:650}
.input-group{display:flex;flex-direction:column;width:100%;border-radius:var(--lg);overflow:hidden;border:1px solid var(--line)}
.input-group:focus-within{border-color:var(--blue)}
.input-group input{border:0;border-radius:0;background:var(--bg);margin:0;padding:16px}
.input-group .btn{border-radius:0}
input{width:100%;padding:14px 16px;border-radius:var(--md);border:1px solid var(--line);background:var(--bg);color:#e8eaed;font-size:1rem;user-select:text;-webkit-user-select:text;min-width:0}
input:focus{border-color:var(--blue);outline:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line);border-radius:var(--md);min-width:0}
.row:last-child{border-bottom:0}
.row.me{background:var(--bluebox)}
.place{width:32px;text-align:center;color:var(--blue);font-weight:750;flex-shrink:0}
.ava,.avatar-preview{width:38px;height:38px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.ava img,.avatar-preview img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.name{flex:1;min-width:0;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.time{font-variant-numeric:tabular-nums;font-weight:750;font-size:.9rem;color:var(--gold);flex-shrink:0;white-space:nowrap}
.empty{color:#9aa0a6;font-size:.92rem;text-align:center;padding:20px 12px;line-height:1.5}
.muted{color:var(--muted);font-size:.85rem;text-align:center;margin-top:10px;line-height:1.5}
.err{color:#ff8a80;font-size:.85rem;margin-top:8px;min-height:1em;line-height:1.4}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--panel);padding:6px;border-radius:var(--xl);border:1px solid var(--line)}
.tabs button{flex:1;min-width:0;min-height:44px;padding:9px 4px;border-radius:var(--lg);background:transparent;color:var(--muted);font-weight:650;font-size:.9rem}
.tabs button.on{background:var(--bluebox);color:var(--blue)}
.avatar-picker{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avatar-preview{width:64px;height:64px;font-size:2rem;border:2px solid var(--line)}
.upload-label{flex:1;padding:14px;text-align:center;border-radius:var(--md);background:var(--panel2);cursor:pointer;font-weight:650;font-size:.95rem;min-height:48px}
.upload-label input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.settings-stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel2);border-radius:var(--lg);padding:14px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:.78rem;margin-bottom:6px}
.stat strong{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-head h2{margin-bottom:0}
.small-btn{background:var(--panel2);color:var(--blue);padding:8px 12px;border-radius:12px;font-size:.82rem;font-weight:650}
@media(max-width:380px){body{padding:10px}.card{padding:16px}.tabs button{font-size:.82rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app" id="app">
<h1>Останови время</h1>
<div id="content"></div>
</main>
<script>
(() => {
'use strict';

const STORE = {
  user: 'st_user',
  results: 'st_results',
  legacy: 'st_tops'
};

const read = (key, fallback) => {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : JSON.parse(value);
  } catch {
    return fallback;
  }
};

const write = (key, value) => {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch {
    return false;
  }
};

const remove = key => {
  try {
    localStorage.removeItem(key);
  } catch {}
};

const validUser = value =>
  value && typeof value === 'object' &&
  typeof value.id === 'string' &&
  typeof value.name === 'string' &&
  value.name.length > 0;

const validResult = value =>
  value && typeof value === 'object' &&
  typeof value.id === 'string' &&
  typeof value.name === 'string' &&
  Number.isFinite(value.time) &&
  value.time >= 0 &&
  Number.isFinite(value.ts);

let user = read(STORE.user, null);
if (!validUser(user)) user = null;
let results = read(STORE.results, null);

if (!Array.isArray(results)) {
  const oldResults = read(STORE.legacy, []);
  results = Array.isArray(oldResults)
    ? oldResults.filter(item => item && typeof item.id === 'string' && typeof item.name === 'string' && Number.isFinite(item.time) && item.time >= 0)
      .map(item => ({...item, ts: Number.isFinite(item.ts) ? item.ts : Date.now()}))
    : [];
  write(STORE.results, results);
}
results = results.filter(validResult);

let tab = 'game';
let state = 'idle';
let startTime = 0;
let elapsed = 0;
let rafId = 0;
let saveError = '';

const $ = (selector, root = document) => root.querySelector(selector);
const now = () => performance.now();

const formatTime = ms => {
  if (!Number.isFinite(ms) || ms < 0) ms = 0;
  if (ms < 1) return `${(ms * 1000).toFixed(1)} мкс`;
  if (ms < 1000) return `${ms.toFixed(3)} мс`;
  return `${(ms / 1000).toFixed(4)} с`;
};

const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
})[char]);

const safeAvatar = value =>
  typeof value === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(value)
    ? value
    : '';

const avatarMarkup = value => {
  const src = safeAvatar(value);
  return src ? `<img src="${src}" alt="Аватар">` : '👤';
};

const persist = () => {
  const userSaved = write(STORE.user, user);
  const resultsSaved = write(STORE.results, results);
  saveError = userSaved && resultsSaved ? '' : 'Не удалось сохранить все данные. Возможно, память браузера заполнена.';
  return !saveError;
};

const bestResults = () => {
  const best = new Map();
  for (const result of results) {
    const previous = best.get(result.id);
    if (!previous || result.time < previous.time) best.set(result.id, result);
  }
  return [...best.values()].sort((a, b) => a.time - b.time);
};

const ownResults = () => results
  .filter(result => result.id === user.id)
  .sort((a, b) => b.ts - a.ts);

function render() {
  const content = $('#content');
  content.replaceChildren();

  if (!user) {
    renderOnboarding(content);
    return;
  }

  const tabs = document.createElement('nav');
  tabs.className = 'tabs';
  tabs.setAttribute('aria-label', 'Разделы');
  const tabItems = [['game', 'Игра'], ['top', 'Рейтинг'], ['history', 'История'], ['settings', 'Настройки']];
  for (const [key, label] of tabItems) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.className = tab === key ? 'on' : '';
    button.setAttribute('aria-current', tab === key ? 'page' : 'false');
    button.addEventListener('click', () => {
      if (tab === key) return;
      if (state === 'running') stopGame();
      tab = key;
      render();
    });
    tabs.appendChild(button);
  }
  content.appendChild(tabs);

  if (tab === 'game') renderGame(content);
  else if (tab === 'top') renderTop(content);
  else if (tab === 'history') renderHistory(content);
  else renderSettings(content);

  if (saveError) {
    const warning = document.createElement('p');
    warning.className = 'err';
    warning.setAttribute('role', 'alert');
    warning.textContent = saveError;
    content.appendChild(warning);
  }
}

function renderOnboarding(root) {
  const card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = `
    <h2>Как тебя зовут?</h2>
    <form id="nameForm" novalidate>
      <div class="input-group">
        <input id="inpName" maxlength="20" placeholder="Имя (до 20 символов)" autocomplete="nickname" required>
        <button type="submit" class="btn primary">Продолжить</button>
      </div>
      <p id="err" class="err" role="alert"></p>
    </form>
    <p class="muted">Аватар можно добавить позже в настройках.</p>`;
  root.appendChild(card);

  const input = $('#inpName', card);
  $('#nameForm', card).addEventListener('submit', event => {
    event.preventDefault();
    const name = input.value.trim();
    if (!name) {
      $('#err', card).textContent = 'Введи имя.';
      input.focus();
      return;
    }
    user = {
      id: globalThis.crypto?.randomUUID?.() || `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`,
      name: name.slice(0, 20),
      ava: ''
    };
    persist();
    render();
  });
  input.focus({preventScroll: true});
}

function renderGame(root) {
  const mine = ownResults();
  const best = mine.length ? Math.min(...mine.map(result => result.time)) : null;
  const card = document.createElement('section');
  card.innerHTML = `
    <div class="timer" aria-live="off">
      <span id="liveTime">${formatTime(elapsed)}</span>
      ${best === null ? '' : `<div class="label">Твой рекорд: <strong>${formatTime(best)}</strong></div>`}
    </div>
    <button type="button" class="big-btn ${state === 'running' ? 'stop' : 'start'}" id="actionButton">${state === 'running' ? 'СТОП' : 'СТАРТ'}</button>
    <p class="muted">Запусти таймер и останови его как можно быстрее.</p>
    <div class="stat-grid" style="margin-top:18px">
      <div class="stat"><small>Попыток</small><strong>${mine.length}</strong></div>
      <div class="stat"><small>Лучший результат</small><strong>${best === null ? '—' : formatTime(best)}</strong></div>
    </div>`;
  root.appendChild(card);

  const button = $('#actionButton', card);
  const timeDisplay = $('#liveTime', card);

  const updateButton = () => {
    button.textContent = state === 'running' ? 'СТОП' : 'СТАРТ';
    button.classList.toggle('stop', state === 'running');
    button.classList.toggle('start', state !== 'running');
    button.setAttribute('aria-label', state === 'running' ? 'Остановить таймер' : 'Запустить таймер');
  };

  const activate = event => {
    if (event.cancelable) event.preventDefault();
    if (state === 'running') stopGame();
    else startGame(timeDisplay, updateButton);
  };

  button.addEventListener('pointerdown', activate);
  button.addEventListener('click', event => {
    if (event.detail === 0) activate(event);
  });
  updateButton();
}

function startGame(display, updateButton) {
  if (state === 'running') return;
  startTime = now();
  elapsed = 0;
  state = 'running';
  updateButton();

  const tick = () => {
    if (state !== 'running') return;
    elapsed = now() - startTime;
    if (display.isConnected) display.textContent = formatTime(elapsed);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function stopGame() {
  if (state !== 'running') return;
  elapsed = Math.max(0, now() - startTime);
  state = 'stopped';
  cancelAnimationFrame(rafId);

  results.push({
    id: user.id,
    name: user.name,
    ava: safeAvatar(user.ava),
    time: elapsed,
    ts: Date.now()
  });

  results.sort((a, b) => a.ts - b.ts);
  persist();
  render();
}

function renderTop(root) {
  const card = document.createElement('section');
  card.className = 'card';
  const ranking = bestResults();
  let html = '<h2>Лучшие результаты игроков</h2>';
  if (!ranking.length) {
    html += '<div class="empty">Пока нет результатов. Сыграй первым!</div>';
  } else {
    const medals = ['🥇', '🥈', '🥉'];
    ranking.slice(0, 100).forEach((entry, index) => {
      html += `<div class="row${entry.id === user.id ? ' me' : ''}">
        <div class="place">${medals[index] || index + 1}</div>
        <div class="ava">${avatarMarkup(entry.ava)}</div>
        <div class="name">${escapeHTML(entry.name)}</div>
        <div class="time">${formatTime(entry.time)}</div>
      </div>`;
    });
  }
  card.innerHTML = html;
  root.appendChild(card);
}

function renderHistory(root) {
  const card = document.createElement('section');
  card.className = 'card';
  const history = ownResults();
  card.innerHTML = `
    <div class="section-head">
      <h2>Твои попытки</h2>
      <button type="button" class="small-btn" id="clearHistory">Очистить</button>
    </div>
    <div id="historyList"></div>`;
  root.appendChild(card);

  const list = $('#historyList', card);
  if (!history.length) {
    list.innerHTML = '<div class="empty">Здесь появятся все твои сохранённые результаты.</div>';
  } else {
    list.innerHTML = history.map((entry, index) => `
      <div class="row">
        <div class="place">${index + 1}</div>
        <div class="name">${new Date(entry.ts).toLocaleString('ru-RU')}</div>
        <div class="time">${formatTime(entry.time)}</div>
      </div>`).join('');
  }

  $('#clearHistory', card).addEventListener('click', () => {
    if (!confirm('Удалить всю историю твоих попыток?')) return;
    results = results.filter(entry => entry.id !== user.id);
    persist();
    render();
  });
}

function renderSettings(root) {
  const card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = `
    <h2>Настройки профиля</h2>
    <div class="avatar-picker">
      <div class="avatar-preview" id="currentAvatar">${avatarMarkup(user.ava)}</div>
      <label class="upload-label">Загрузить аватар
        <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" id="avatarFile">
      </label>
    </div>
    <form id="settingsForm" novalidate>
      <input id="newName" maxlength="20" value="${escapeHTML(user.name)}" placeholder="Имя игрока" autocomplete="nickname" required>
      <p id="settingsError" class="err" role="alert"></p>
      <div class="settings-stack">
        <button type="submit" class="btn primary">Сохранить изменения</button>
        <button type="button" class="btn danger" id="resetAll">Сбросить весь прогресс</button>
      </div>
    </form>`;
  root.appendChild(card);

  const error = $('#settingsError', card);
  $('#settingsForm', card).addEventListener('submit', event => {
    event.preventDefault();
    const name = $('#newName', card).value.trim();
    if (!name) {
      error.textContent = 'Имя не может быть пустым.';
      return;
    }
    user.name = name.slice(0, 20);
    results = results.map(entry => entry.id === user.id ? {...entry, name: user.name, ava: safeAvatar(user.ava)} : entry);
    persist();
    render();
  });

  $('#avatarFile', card).addEventListener('change', async event => {
    const file = event.target.files?.[0];
    if (!file) return;
    if (!['image/png', 'image/jpeg', 'image/webp', 'image/gif'].includes(file.type)) {
      error.textContent = 'Выбери PNG, JPEG, WEBP или GIF.';
      event.target.value = '';
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      error.textContent = 'Размер изображения — не более 5 МБ.';
      event.target.value = '';
      return;
    }
    try {
      const bitmap = await createImageBitmap(file);
      if (bitmap.width > 10000 || bitmap.height > 10000) throw new Error('Размеры изображения слишком большие.');
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const context = canvas.getContext('2d');
      if (!context) throw new Error('Не удалось обработать изображение.');
      const side = Math.min(bitmap.width, bitmap.height);
      context.drawImage(bitmap, (bitmap.width - side) / 2, (bitmap.height - side) / 2, side, side, 0, 0, 128, 128);
      bitmap.close();
      user.ava = canvas.toDataURL('image/jpeg', 0.82);
      results = results.map(entry => entry.id === user.id ? {...entry, ava: user.ava} : entry);
      persist();
      $('#currentAvatar', card).innerHTML = avatarMarkup(user.ava);
      error.textContent = saveError;
    } catch (problem) {
      error.textContent = problem instanceof Error ? problem.message : 'Не удалось обработать изображение.';
    }
    event.target.value = '';
  });

  $('#resetAll', card).addEventListener('click', () => {
    if (!confirm('Точно удалить профиль и все сохранённые результаты?')) return;
    cancelAnimationFrame(rafId);
    remove(STORE.user);
    remove(STORE.results);
    remove(STORE.legacy);
    user = null;
    results = [];
    state = 'idle';
    elapsed = 0;
    tab = 'game';
    saveError = '';
    render();
  });
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'running') {
    elapsed = Math.max(0, now() - startTime);
  }
});

window.addEventListener('storage', event => {
  if (event.key === STORE.user || event.key === STORE.results) {
    user = read(STORE.user, null);
    if (!validUser(user)) user = null;
    results = read(STORE.results, []);
    if (!Array.isArray(results)) results = [];
    results = results.filter(validResult);
    if (state !== 'running') render();
  }
});

render();
})();
</script>
</body>
</html>
